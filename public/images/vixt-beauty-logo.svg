<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">VIXT Beauty</title>
  <desc id="desc">Emblema VIXT Beauty — Gestão Inteligente para Salões de Beleza</desc>
  <defs>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1F4"/>
      <stop offset="0.35" stop-color="#F7A0B8"/>
      <stop offset="0.7" stop-color="#E0557E"/>
      <stop offset="1" stop-color="#A12C51"/>
    </linearGradient>
    <linearGradient id="champ" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9EC"/>
      <stop offset="0.5" stop-color="#E4B878"/>
      <stop offset="1" stop-color="#B87A3E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#E0557E" stop-opacity=".28"/>
      <stop offset="1" stop-color="#E0557E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="420" rx="28" fill="#10090C"/>
  <circle cx="320" cy="150" r="150" fill="url(#glow)"/>

  <!-- Crown -->
  <path d="M274 40 l16 20 30-32 30 32 16-20 -8 44 h-76z" fill="url(#champ)" stroke="#FFF3D7" stroke-width="1.5"/>
  <circle cx="320" cy="60" r="4" fill="#FFF9EC"/>

  <!-- Circular frame -->
  <circle cx="320" cy="152" r="78" fill="none" stroke="url(#rose)" stroke-width="2" opacity=".85"/>

  <!-- Hair silhouette -->
  <path d="M300 118 C268 120 252 148 258 178 C262 200 248 214 240 232 C268 222 286 208 296 192 C300 210 292 226 286 242 C312 226 330 200 332 172 C344 194 366 208 392 216 C378 196 366 182 366 166 C372 138 348 116 320 116 Z" fill="url(#rose)" opacity=".95"/>

  <!-- Face profile -->
  <path d="M330 126 C348 128 356 140 356 152 C356 160 350 166 350 172 C356 176 360 180 356 186 C352 191 344 190 340 194 C338 200 334 206 326 208 C314 212 302 202 300 188 C298 172 302 150 312 138 C317 131 324 126 330 126 Z" fill="#F7C7B2" stroke="url(#rose)" stroke-width="1.5"/>
  <!-- Neck -->
  <path d="M308 200 C310 214 306 226 300 236 L330 236 C324 222 326 212 326 208 Z" fill="#F0BCA6"/>

  <!-- Wordmark -->
  <text x="320" y="298" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" letter-spacing="10" fill="url(#rose)">VIXT</text>
  <text x="320" y="342" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="52" font-style="italic" fill="url(#rose)">Beauty</text>
  <line x1="150" y1="360" x2="490" y2="360" stroke="url(#champ)" stroke-width="1"/>
  <text x="320" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#E4B878">GESTÃO INTELIGENTE PARA SALÕES DE BELEZA</text>
</svg>
